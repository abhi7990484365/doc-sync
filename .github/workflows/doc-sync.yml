name: Sync project documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate project documentation
        run: python -m src.doc_sync .

      - name: Commit documentation if changed
        run: |
          if git diff --quiet -- docs/PROJECT_DOC.md; then
            echo "Documentation is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_DOC.md
          git commit -m "docs: sync project documentation"
          git push origin HEAD:main
